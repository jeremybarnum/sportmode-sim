name: Cloud bench
run-name: Cloud bench (${{ inputs.tests || 'all' }} on ${{ inputs.workspace_ref || inputs.workspace_branch || 'SportMode-bench' }})

# The Sport Mode bench on one of GitHub's macOS runners, from nothing: the simulators and libraries,
# a paired phone and watch Simulator, Loop's apps from a LoopWorkspace branch with the Simulator aids,
# the phone onboarded by cloud/onboard.sh, then tests/run.sh. Everything README's Setup does by hand.
on:
  push:
    branches: [cloud-ci]
  workflow_dispatch:
    inputs:
      workspace_branch:
        description: LoopWorkspace branch to test (jeremybarnum/LoopWorkspace)
        default: SportMode-bench
      tests:
        description: "Tests for tests/run.sh: names (T1 T3), quick, or all"
        default: T3
      time_scale:
        description: TIME_SCALE for the run
        default: "5"
      simlink_live:
        description: "1: SimLink carries the live phone–watch messages (README); empty: the Simulators do"
        default: "1"
  # Called from a LoopWorkspace workflow, to test the commit that was pushed there.
  workflow_call:
    inputs:
      workspace_ref:
        description: LoopWorkspace branch or commit to test
        type: string
        required: true
      tests:
        type: string
        default: quick
      time_scale:
        type: string
        default: "5"
      harness_ref:
        description: sportmode-sim branch or commit that runs it
        type: string
        default: main
      simlink_live:
        type: string
        default: "1"

# One run per branch and kind: a run on our own Mac, or on Apple's own live channel, does not cancel
# one of the other kinds.
concurrency:
  group: cloud-bench-${{ inputs.workspace_ref || github.ref }}${{ contains(github.event.head_commit.message, '[bench-mac]') && '-mac' || '' }}${{ contains(github.event.head_commit.message, '[apple-wc]') && '-apple-wc' || '' }}
  cancel-in-progress: true

env:
  WORKSPACE_BRANCH: ${{ inputs.workspace_ref || inputs.workspace_branch || 'SportMode-bench' }}
  TESTS: ${{ inputs.tests || 'all' }}
  TIME_SCALE: ${{ inputs.time_scale || '5' }}
  # On a runner the paired Simulators can take minutes to deliver a live message while both read
  # reachable, far past the loan protocol's 10 and 30 s windows: SimLink carries them instead.
  # A commit saying [apple-wc] leaves them to the Simulators.
  SIMLINK_LIVE: ${{ contains(github.event.head_commit.message, '[apple-wc]') && '0' || (inputs.simlink_live == null && '1' || inputs.simlink_live) }}
  # A runner's taps and Bluetooth stand-ins are slower than a Mac's: each timed check gets 2 s more
  # there (none on our own Mac).
  TIME_SLACK: ${{ contains(github.event.head_commit.message, '[bench-mac]') && '0' || '2' }}
  WORKSPACE: ${{ github.workspace }}/../LoopWorkspace
  # Unsigned machines: every target signed ad hoc, with one team so the bundle ids agree.
  APPS_FLAGS: CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= DEVELOPMENT_TEAM=CI00000000
  # A runner can be slow enough that a tap driver takes minutes to attach.
  UI_ATTACH_SECONDS: 300
  ONBOARD_SLOW: 3

jobs:
  bench:
    if: ${{ !contains(github.event.head_commit.message, '[probe]') && !contains(github.event.head_commit.message, '[pairdiag]') }}
    # A commit saying [bench-mac] runs on our own Mac (a self-hosted runner labelled bench-mac).
    runs-on: ${{ contains(github.event.head_commit.message, '[bench-mac]') && fromJSON('["self-hosted", "bench-mac"]') || 'macos-26' }}
    timeout-minutes: 240
    steps:
      # The harness itself, also when another repository calls this workflow.
      - uses: actions/checkout@v5
        with:
          repository: jeremybarnum/sportmode-sim
          ref: ${{ inputs.harness_ref || '' }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Xcode and xcodegen
        run: |
          # The newest Xcode installed, for the newest Simulator runtimes (sim.sh sims takes those).
          # GitHub's images keep several, named by version; a Mac of our own has the one it was given.
          x=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$x" ] || sudo xcode-select --switch "$x/Contents/Developer"
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          go version
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          xcrun simctl list runtimes | grep -E "iOS|watchOS"

      - name: LoopWorkspace with the Simulator aids
        run: |
          # A runner of our own keeps the checkout between runs.
          [ -d "$WORKSPACE/.git" ] || git clone --quiet https://github.com/jeremybarnum/LoopWorkspace "$WORKSPACE"
          ./tree.sh "$WORKSPACE_BRANCH"   # WORKSPACE names the checkout

      - name: Simulators, mux and libraries
        run: ./sim.sh build

      # On a runner a pair whose two Simulators boot together stays "(active, disconnected)", so the
      # phone never sees the watch app (cloud/pairdiag.sh). Booted in order, phone fully first,
      # it connects.
      - name: Paired phone and watch Simulators
        timeout-minutes: 20
        run: |
          ./sim.sh sims
          . ./.sims
          xcrun simctl shutdown "$SIMS_WATCH" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMS_PHONE" -b >/dev/null
          xcrun simctl boot "$SIMS_WATCH"; xcrun simctl bootstatus "$SIMS_WATCH" -b >/dev/null
          for i in $(seq 1 40); do
            s=$(xcrun simctl list pairs | grep -B1 "$SIMS_WATCH" | head -1)
            echo "$(date +%T) $s"
            case "$s" in *"(active, connected)"*) exit 0 ;; esac
            sleep 15
          done
          echo "the pair did not connect"; exit 1

      # The apps take 40 minutes to build here: kept per workspace commit, aids and harness.
      - name: Key for the built apps
        id: key
        run: |
          ws=$(git -C "$WORKSPACE" rev-parse FETCH_HEAD)
          echo "ws=apps-$ws-" >>"$GITHUB_OUTPUT"
          echo "apps=apps-$ws-$(cat aids/*/* sim.sh | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: apps
        with:
          path: build/dd/Build/Products
          key: ${{ steps.key.outputs.apps }}
          restore-keys: ${{ steps.key.outputs.ws }}

      - name: Loop's phone and watch apps
        timeout-minutes: 90
        run: |
          if [ -d build/dd/Build/Products/Debug-iphonesimulator/Loop.app ]; then echo "apps from the cache (${{ steps.apps.outputs.cache-matched-key }})"
          else ./sim.sh apps || { grep -E " error:|BUILD FAILED" build/run/apps-build.log | head -40; exit 1; }; fi
          ./sim.sh install

      - uses: actions/cache/save@v4
        if: steps.apps.outputs.cache-hit != 'true'
        with:
          path: build/dd/Build/Products
          key: ${{ steps.key.outputs.apps }}

      - name: Tap drivers
        run: ./ui.sh build

      - name: Start the pod and sensor
        run: ./sim.sh start -fresh

      - name: Onboard the phone
        timeout-minutes: 75
        run: |
          ./sim.sh launch phone
          sleep 10
          ./cloud/onboard.sh

      - name: Watch app, and the watch reading the sensor
        timeout-minutes: 25
        run: |
          t=$(date +%T)
          ./sim.sh launch watch
          # The phone sees a watch app installed after it only at a later launch (README); on a
          # runner one relaunch is not always enough: relaunch until its link line says so.
          ok=
          for i in 1 2 3 4 5; do
            sleep 20
            p=$(date +%T)
            ./sim.sh launch phone >/dev/null
            for j in $(seq 1 18); do
              l=$(./sim.sh since phone "$p" 'appInstalled=true' 2>/dev/null | tail -1)
              [ -n "$l" ] && { echo "phone knows the watch app (launch $i): $l"; ok=1; break 2; }
              sleep 5
            done
            echo "launch $i: the phone does not see the watch app yet"
          done
          [ -n "$ok" ] || { ./sim.sh log phone 20; exit 1; }
          for i in $(seq 1 84); do
            l=$(./sim.sh since watch "$t" 'INGEST src=direct-G7' 2>/dev/null | tail -1)
            [ -n "$l" ] && { echo "watch reads the sensor: $l"; exit 0; }
            sleep 5
          done
          echo "the watch did not read the sensor in 7 minutes"; ./sim.sh log watch 60; exit 1

      - name: Tests
        timeout-minutes: 150
        run: |
          set -- $TESTS; [ "$1" = all ] && set --
          tests/run.sh "$@"

      - name: Test logs
        if: always()
        run: |
          d=$(ls -dt build/results/*/ 2>/dev/null | head -1)
          [ -n "$d" ] || { echo "no results"; exit 0; }
          cat "$d/summary.txt" 2>/dev/null
          for f in "$d"/*.log; do echo "::group::$(basename "$f")"; cat "$f"; echo "::endgroup::"; done

      - name: Diagnostics
        if: failure()
        run: |
          set +e
          for s in pod g7 mux; do echo "::group::$s log"; ./sim.sh log $s 80 2>&1; echo "::endgroup::"; done
          for s in phone watch; do echo "::group::$s app log"; ./sim.sh log $s 120 2>&1; echo "::endgroup::"; done
          for s in phone watch; do echo "::group::$s driver"; tail -40 build/ui-$s.log 2>&1; echo "::endgroup::"; done
          ./sim.sh status 2>&1; ./sim.sh range 2>&1
          xcrun simctl list devices | grep -i "sport mode"
          ls "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | grep -E "Loop|WatchApp" | tail

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-bench
          path: |
            build/results
            build/onboard
            build/run/*.log
            build/ui-*.log
          if-no-files-found: ignore
          retention-days: 7

  # A commit whose message says [probe] runs cloud/probe.sh instead of the bench: install orders
  # tried on fresh paired Simulators with the cached apps, to see which lets the phone see the
  # watch app. Same workflow and branch as the bench, so it shares the apps' cache.
  probe:
    if: ${{ contains(github.event.head_commit.message, '[probe]') }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        run: |
          # GitHub's images keep several, named by version; a Mac of our own has the one it was given.
          x=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$x" ] || sudo xcode-select --switch "$x/Contents/Developer"
          xcodebuild -version
      - name: LoopWorkspace with the Simulator aids
        run: |
          git clone --quiet https://github.com/jeremybarnum/LoopWorkspace "$WORKSPACE"
          ./tree.sh "$WORKSPACE_BRANCH"
      - name: Key for the built apps
        id: key
        run: |
          ws=$(git -C "$WORKSPACE" rev-parse FETCH_HEAD)
          echo "ws=apps-$ws-" >>"$GITHUB_OUTPUT"
          echo "apps=apps-$ws-$(cat aids/*/* sim.sh | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: build/dd/Build/Products
          key: ${{ steps.key.outputs.apps }}
          restore-keys: ${{ steps.key.outputs.ws }}
      - name: Apps (built only if the cache has none)
        timeout-minutes: 90
        run: |
          [ -d build/dd/Build/Products/Debug-iphonesimulator/Loop.app ] && { echo "apps from the cache"; exit 0; }
          ./sim.sh sims && ./sim.sh apps
      - name: Probe
        timeout-minutes: 90
        run: ./cloud/probe.sh

  # A commit whose message says [pairdiag] runs cloud/pairdiag.sh: why a fresh pair stays
  # disconnected on a runner. No apps, so no build or cache.
  pairdiag:
    if: ${{ contains(github.event.head_commit.message, '[pairdiag]') }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        run: |
          # GitHub's images keep several, named by version; a Mac of our own has the one it was given.
          x=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$x" ] || sudo xcode-select --switch "$x/Contents/Developer"
      - name: Pair diagnosis
        run: ./cloud/pairdiag.sh
